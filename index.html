<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1220">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A guided, press-Next simulation of a Snowflake, dbt Core and Airflow data platform, with interview questions, coding problems and architecture decisions.">
  <title>Interview Quest: Senior Data Engineer</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="logo">IQ</span>
        <span class="brand-t"><b>Interview Quest</b><small id="crumb"></small></span>
      </div>
      <div id="segs" class="segs" aria-label="Progress by mission"></div>
      <div class="stats">
        <span class="stat"><b id="xp">0</b> XP<i id="xp-pop" class="xp-pop"></i></span>
        <span class="stat lvl" id="lvl">Rookie</span>
        <span class="stat left" id="left"></span>
        <span class="fs"><button type="button" id="fs-down" aria-label="Smaller text">A-</button><button type="button" id="fs-up" aria-label="Larger text">A+</button></span>
        <button type="button" id="menu-btn" class="btn-sm">Map</button>
      </div>
    </header>

    <main class="main">
      <aside class="coachcol" aria-label="Coach">
        <div class="coach">
          <div id="coach-photo" class="coach-photo"></div>
          <div class="coach-name">Coach Sam<small>your interview coach</small></div>
        </div>
        <div id="bubble" class="bubble" aria-live="polite"></div>
        <div class="hintbox"><span id="hint"></span></div>
      </aside>

      <section class="stagecol" aria-label="Lesson">
        <div class="stage-head">
          <span id="seg-chip" class="seg-chip"></span>
          <h1 id="stage-title"></h1>
        </div>
        <div id="stage-body" class="stage-body"></div>
      </section>
    </main>

    <footer class="bar">
      <button type="button" id="back" class="btn-back">Back</button>
      <div class="pos" id="pos"></div>
      <button type="button" id="next" class="btn-next"><span id="next-label">Next</span> <span aria-hidden="true">&rarr;</span></button>
    </footer>
  </div>
  <div id="overlay" class="overlay"></div>
  <noscript><p style="padding:2rem;font:20px sans-serif">This lesson needs JavaScript. Please enable it and reload.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/graphs.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/term.js"></script>
  <script src="js/render1.js"></script>
  <script src="js/render2.js"></script>
  <script src="js/build.js"></script>
  <script src="js/content/00-start.js"></script>
  <script src="js/content/01-ingest.js"></script>
  <script src="js/content/02-dbt-core.js"></script>
  <script src="js/content/03-dbt-advanced.js"></script>
  <script src="js/content/04-snowflake.js"></script>
  <script src="js/content/05-model-sql.js"></script>
  <script src="js/content/06-python.js"></script>
  <script src="js/content/07-airflow.js"></script>
  <script src="js/content/08-quality.js"></script>
  <script src="js/content/09-cicd.js"></script>
  <script src="js/content/10-incidents.js"></script>
  <script src="js/content/11-architecture.js"></script>
  <script src="js/content/12-people.js"></script>
  <script src="js/content/13-boss.js"></script>
  <script src="js/content/zz-tiers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
